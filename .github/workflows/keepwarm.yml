# Keep the Render Free instance awake during the closed beta.
#
# Why this exists
# ---------------
# The API runs on Render's Free plan, which spins the instance down after ~15
# minutes without traffic. The next request then pays a cold start of roughly
# 30-60s, because the process loads both ONNX models before /health passes.
# A tester who sends their first message into that window sees a minute of
# silence and reasonably concludes the thing is broken.
#
# So this pings /health every 10 minutes, which is inside the idle window and
# therefore keeps the instance from sleeping during normal testing hours.
#
# What it is NOT
# --------------
# It is a mitigation, not a guarantee:
#
#   * GitHub's scheduled workflows are best-effort. Runs drift by a few minutes
#     under load and are occasionally skipped entirely. That is acceptable here
#     - a missed ping costs one slow request, not correctness - but it does mean
#     "every 10 minutes" describes the intent, not a contract.
#   * Every ping spends Render Free instance-hours. Pinging keeps the service
#     awake, which is the point, but awake time is exactly what the monthly
#     budget counts.
#   * GitHub disables scheduled workflows in repositories with no activity for
#     60 days. If the beta goes quiet and then resumes, check this is still
#     enabled.
#
# ONE-TIME SETUP (do this after the Render service exists)
# -------------------------------------------------------
# GitHub -> Settings -> Secrets and variables -> Actions -> Variables tab ->
# New repository variable:
#
#     Name:  GITAGUIDE_HEALTH_URL
#     Value: https://<your-service>.onrender.com
#
# No trailing slash; the workflow appends /health. It is a repository VARIABLE,
# not a secret: the URL is public the moment a tester opens the app, and putting
# it in `vars` keeps it readable in logs where it is useful for debugging.
# Until it is set, this workflow fails fast with an explanatory message rather
# than silently pinging nothing.

name: keep-warm

on:
  schedule:
    # Every 10 minutes. Best-effort; see the note above.
    - cron: "*/10 * * * *"
  # So the ping can be triggered by hand right after a deploy, without waiting
  # up to 10 minutes to find out whether the URL variable is correct.
  workflow_dispatch:

# Never let two pings overlap: a cold start can take longer than the interval,
# and a queue of them would spend instance-hours for no benefit.
concurrency:
  group: keep-warm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the health URL is configured
        env:
          HEALTH_URL: ${{ vars.GITAGUIDE_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::GITAGUIDE_HEALTH_URL is not set."
            echo "Set it at Settings -> Secrets and variables -> Actions ->"
            echo "Variables -> New repository variable:"
            echo "  Name:  GITAGUIDE_HEALTH_URL"
            echo "  Value: https://<your-service>.onrender.com   (no trailing slash)"
            exit 1
          fi

      - name: Ping
        env:
          HEALTH_URL: ${{ vars.GITAGUIDE_HEALTH_URL }}
        run: |
          set -uo pipefail
          url="${HEALTH_URL%/}/health"

          # --max-time 90 because a cold start is the case this exists for: a
          # short timeout would fail precisely when the ping is doing its job.
          # Three attempts with a gap, so one dropped connection is not an
          # incident.
          for attempt in 1 2 3; do
            # Clear the body file first. curl does not truncate it when it
            # cannot connect, so without this a failed attempt can print the
            # *previous* attempt's successful body under a failure header -
            # exactly the kind of misleading output this workflow exists to
            # avoid.
            : > /tmp/health.json

            # curl already writes 000 to stdout when it cannot connect, so
            # its exit status is swallowed rather than adding a second
            # fallback - doing both concatenates them into "000000".
            code=$(curl --silent --show-error --location \
                        --max-time 90 --connect-timeout 15 \
                        --output /tmp/health.json --write-out '%{http_code}' \
                        "$url") || true
            code="${code:-000}"

            if [ "$code" = "200" ]; then
              # Quiet on success: a green run every 10 minutes is only useful
              # if nobody has to read it.
              echo "ok (attempt $attempt)"
              exit 0
            fi

            echo "attempt $attempt: HTTP $code"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          # Loud on failure, with enough to act on. This is the signal that the
          # service is down, misconfigured, or out of Free instance-hours.
          echo "::error::keep-warm ping failed after 3 attempts (last HTTP $code)"
          echo "URL: $url"
          echo "--- last response body (truncated) ---"
          head -c 2000 /tmp/health.json 2>/dev/null || echo "(no body)"
          exit 1
