  # ---------------------------------------------------------------- meta
  # Questions about GitaGuide itself. Added 13 Sep 2026: at a 4-second router
  # ceiling these were the single largest source of routing error, and three of
  # them were timeouts rather than misjudgements - the model knew the answer and
  # was cancelled before it could say so. They are fixed phrases, so a word list
  # answers them at zero cost and the deadline stops mattering for them.
  #
  # Unlike greeting and ack_or_close, a wrong decision here is not free: it
  # means answering "who are you" without scripture when the person wanted
  # guidance. So only phrases that are unambiguously ABOUT the system are
  # listed - "what can you do" is here, "what should I do" is not and must
  # never be.
  meta:
    english:
      - who are you
      - who r u
      - what are you
      - who made you
      - who built you
      - what is this
      - is this ai
      - is this an ai
      - are you ai
      - are you an ai
      - are you a bot
      - are you human
      - are you real
      - what can you do
      - how do you work
      - can i trust these verses
      - can i trust this
      - which edition
      - which gita edition
      - what edition
      - which translation
      - what is arthashastra
      - what is the gita
    hindi_roman:
      - tum kaun ho
      - aap kaun ho
      - tu kaun hai
      - kya kar sakte ho
      - tum kya kar sakte ho
      - aap kya kar sakte ho
      - ye kya hai
      - yeh kya hai
    hindi_devanagari:
      - तुम कौन हो
      - आप कौन हैं
      - क्या कर सकते हो
      - तुम क्या कर सकते हो
      - यह क्या है
      - ये क्या है
    gujarati_roman:
      - tame kon cho
      - su kari shako cho
    gujarati_script:
      - તમે કોણ છો

  # ------------------------------------------------------------- followup
  # Continuations that carry no subject of their own. These are only follow-ups
  # when there is something to follow: with no history the router downgrades
  # them to guidance, because "simpler" as a first message is not a request to
  # simplify anything.
  #
  # They also retrieve, which is why they get the previous user turn as their
  # retrieval query - their own two words would search for nothing.
  followup:
    english:
      - in hindi
      - in english
      - in hinglish
      - simpler
      - simpler please
      - more simply
      - say more
      - tell me more
      - go on
      - example
      - an example
      - give an example
      - for example
      - another one
      - what else
    hindi_roman:
