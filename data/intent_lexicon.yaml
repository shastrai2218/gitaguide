# GitaGuide conversational router - stage 1 lexicon
# ============================================================================
#
# WHAT THIS IS FOR
# ----------------
# Before this file existed, "hi" went through emotion detection, intent
# classification, hybrid retrieval and a grounded generation call, and the
# tester got a verse about detachment from the fruits of action. Every message
# was treated as a request for guidance because nothing ever asked whether it
# was one.
#
# Stage 1 of the router answers that question for the cases where no model is
# needed. A short message made up ENTIRELY of terms below plus fillers is
# decided here at zero latency and zero cost. Everything else falls through to
# stage 2 (a model call), which fails open to `guidance`.
#
# The length bound is four words, or the longest phrase in this file if that is
# longer - so adding "can i trust these verses" permits a five-word message to
# be decided without widening the bound for a one-word greeting. The
# whole-message rule below is what actually keeps that safe.
#
# WHAT MAY AND MAY NOT BE DECIDED HERE
# ------------------------------------
# Four routes: greeting, ack_or_close, meta and followup. All four are things a
# word list can genuinely recognise, because all four are messages with no
# subject of their own.
#
# `guidance` may NEVER appear in this file. Deciding that a message IS a real
# request for help is a much stronger claim than deciding it is a greeting, and
# it is not one a word list can support - so guidance is only ever reached by
# the model, or by failing open. `crisis` may never appear either; see below.
# tests/test_router.py asserts both.
#
# WHY "ENTIRELY"
# --------------
# Matching on *containment* would be a safety bug, not just a quality one.
# "hi i want to die" contains "hi". The rule is whole-message consumption, so a
# message with any token outside these lists cannot be decided here - it falls
# through to the model, and a model failure falls through to guidance, which
# retrieves. The cheap path can only ever skip retrieval for a message that is
# nothing but greeting or acknowledgement.
#
# Crisis is not in this file and must never be. The safety gate runs BEFORE the
# router and short-circuits the turn; the router is not consulted at all on a
# blocked turn. See app/pipeline/router.py and tests/test_router.py.
#
# HOW TO GROW IT
# --------------
# Add the term to the right language list and nothing else. Matching is
# case-insensitive, ignores punctuation and emoji, and collapses repeated
# letters on both sides, so "hii", "hiii" and "okkk" need no entries of their
# own. Multi-word phrases are fine and are matched longest-first. Do not add a
# term that is also an ordinary word inside a real question ("help", "please",
# "problem", "kaam", "matlab") - the whole-message rule is the only thing
# standing between a mis-added term and a swallowed cry for help.

version: 1

# Words that carry no routing signal and may pad any stage-1 match.
# "hey there" is a greeting; "there" on its own decides nothing.
fillers:
  - there
  - again
  - all
  - everyone
  - guys
  - team
  - sir
  - madam
  - ji
  - bro
  - bhai
  - yaar
  - dost
  - friend
  - please
  - pls
  - plz
  - so
  - much
  - lot
  - very
  - bahut
  - too
  - and
  - a
  - u
  - you

routes:
  # ------------------------------------------------------------------ greeting
  # Opening a conversation. Wants a warm hello, not scripture.
  greeting:
