# Render blueprint for the GitaGuide beta API.
#
# Every secret is declared with `sync: false`, which means Render prompts for it
# in the dashboard and never stores it in this file or in git. Nothing here
# contains a key, a password, or a connection string - see .env.production.example
# for the shape of each value and docs/DEPLOY.md for the order to set them in.
#
# Plan: Free, deliberately, for the closed beta.
#
# The trade-off, stated plainly because it is a real cost and not a footnote:
# a Free instance spins down after ~15 minutes with no traffic, and the next
# request pays a cold start - roughly 30-60s on this image, because the process
# also loads both ONNX models before the health check passes.
#
# The compensating control is .github/workflows/keepwarm.yml, which pings
# /health every 10 minutes so the instance rarely gets the chance to sleep
# during a testing session. That is a mitigation, not a fix: GitHub's cron is
# best-effort, the Free tier has a monthly instance-hour budget the ping itself
# consumes, and a genuinely quiet night will still produce one slow first
# message. The frontend says so in plain language rather than hiding it behind
# a spinner (see WaitingIndicator's 35s stage).
#
# MEASURED MEMORY - read this before keeping the free plan.
#
# Run under Render Free's exact shape (512 MB, 0.1 CPU) on 7 Sep 2026:
#
#   idle, immediately after boot ......... 497 MiB  (97.1% of 512)
#   peak during one normal turn .......... 511 MiB  (99.7%)
#   boot to first healthy /health ........  95 s
#   one turn .............................  34 s
#
# That is about 1.5 MiB of headroom. A single turn fits; nothing else does.
# Anything extra - a second concurrent inference, ONNX arena growth, the
# platform's own agent - pushes it over, and the kernel's response is SIGKILL.
# The container is not asked politely to stop, so nothing appears in the
# application log: Render reports a bare 502 and the process restarts.
#
# Two reductions were measured and neither is worth taking:
#   * disabling ONNX Runtime's CPU arena saves 1.4 MiB - noise;
#   * an INT8 embedder saves 52-64 MiB, but its vectors drift to 0.986 min
#     cosine against the fp32-built index, versus 0.99999999 for the fp32 ONNX
#     encoder. Six orders of magnitude more drift, against an index that cannot
#     be rebuilt cheaply, for 60 MiB. Not a trade worth making silently.
#
# So the free plan is under-specified for this image, not misconfigured. The
# fix is the plan, not the code.
#
# Escalation: switching to Starter is one dropdown in the Render dashboard and
# takes effect without a redeploy. If cold starts turn out to cost more tester
# goodwill than the plan costs money, change it there and update this file.

services:
  - type: web
    name: gitaguide-api
    runtime: docker
    plan: free
    region: singapore # closest to the testers; change if yours are elsewhere
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # One instance. The rate limiter and telemetry counters are in-process, so
    # scaling out would multiply every configured limit by the instance count.
    numInstances: 1
    autoDeploy: false # deploy deliberately during a beta, not on every push

    envVars:
      # ---- mode -----------------------------------------------------------
      - key: GITAGUIDE_ENVIRONMENT
        value: prod
      - key: GITAGUIDE_LOG_LEVEL
        value: INFO
      # The single most important variable here. `true` would serve every
      # tester canned text from in-process fakes while /health still looked fine.
      - key: GITAGUIDE_MOCK_MODE
        value: "false"

      # ---- secrets: entered in the Render dashboard, never in git ----------
      - key: NVIDIA_API_KEY
        sync: false
      - key: GITAGUIDE_POSTGRES_DSN
        sync: false
      - key: GITAGUIDE_NEO4J_URI
        sync: false
      - key: GITAGUIDE_NEO4J_PASSWORD
        sync: false
      # Not secrets, but not constants either: on AuraDB Free the username and
      # the database name are both the instance id, not "neo4j". Prompted for
      # rather than defaulted, because a hardcoded "neo4j" here fails with
      # "Unauthorized" / "database does not exist" and neither message mentions
      # Aura's naming.
      - key: GITAGUIDE_NEO4J_USERNAME
        sync: false
      - key: GITAGUIDE_NEO4J_DATABASE
        sync: false
      - key: GITAGUIDE_TELEMETRY_SESSION_SALT
        sync: false

      # ---- backends -------------------------------------------------------
      - key: GITAGUIDE_USE_REAL_NEO4J
        value: "true"
      - key: GITAGUIDE_LLM_PROVIDER
        value: nvidia

      # ---- limits: explicit in production, never left to code defaults ----
      # The global bucket is what protects the ~40 req/min NIM budget; one turn
      # spends two calls on the primary model. See app/api/ratelimit.py.
      - key: GITAGUIDE_RATE_LIMIT_ENABLED
        value: "true"
      - key: GITAGUIDE_RATE_LIMIT_SESSION_PER_MINUTE
        value: "5"
      - key: GITAGUIDE_RATE_LIMIT_SESSION_BURST
        value: "3"
      # Render terminates TLS and proxies to the container, so exactly one
      # trusted proxy stands in front of this process. Without this the per-IP
      # limit would key on the socket peer - the proxy - and collapse into a
      # second global bucket. Set it to the real number of proxies: a larger
      # value lets a client pick its own bucket by forging X-Forwarded-For.
      - key: GITAGUIDE_RATE_LIMIT_TRUSTED_PROXY_HOPS
        value: "1"
      - key: GITAGUIDE_RATE_LIMIT_IP_PER_MINUTE
        value: "20"
      - key: GITAGUIDE_RATE_LIMIT_IP_BURST
        value: "8"
      - key: GITAGUIDE_RATE_LIMIT_GLOBAL_PER_MINUTE
        value: "16"
      - key: GITAGUIDE_RATE_LIMIT_GLOBAL_BURST
        value: "6"

      # Must be >= 15; the app refuses to boot below that, because the intent
      # classifier shares this budget with generation.
      - key: GITAGUIDE_GENERATION_BUDGET_SECONDS
        value: "45"

      # ---- consent and telemetry ------------------------------------------
      - key: GITAGUIDE_CONSENT_REQUIRED
        value: "true"
      - key: GITAGUIDE_CONSENT_VERSION
        value: v1
      - key: GITAGUIDE_TELEMETRY_ENABLED
        value: "true"
      - key: GITAGUIDE_TELEMETRY_PATH
        value: /app/logs/telemetry.jsonl

      # ---- CORS: set to the Vercel URL once the frontend exists ------------
      # Left blank on purpose. The frontend is deployed after the API, so this
      # is filled in on the second pass (docs/DEPLOY.md step 4).
      - key: GITAGUIDE_CORS_ORIGINS
        sync: false
